name: Build SEO pages

on:
  push:
    branches:
      - main
      - agent/seo-optimization
      - agent/fix-seo-integration
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

jobs:
  build-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate integrated SEO pages
        run: python scripts/build_seo_integrated.py

      - name: Validate output
        run: |
          python -m py_compile scripts/build_seo.py scripts/build_seo_integrated.py
          node --check shop/storefront.js
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ET.parse('sitemap.xml')
          pages = list(Path('products').glob('*.html'))
          if not pages:
              raise SystemExit('No product pages generated')

          required = [
              Path('index.html'),
              Path('llms.txt'),
              Path('sitemap.xml'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing generated files: {missing}')

          obsolete = [
              Path('shop/index.html'),
              Path('shop/reptiles.html'),
              Path('shop/reptile-supplies.html'),
              Path('shop/feeders.html'),
              Path('shop/aquatic-plants.html'),
              Path('shop/entomology-art.html'),
              Path('care-guides/index.html'),
              Path('about.html'),
              Path('contact.html'),
              Path('shipping.html'),
          ]
          remaining = [str(path) for path in obsolete if path.exists()]
          if remaining:
              raise SystemExit(f'Duplicate SEO shell pages remain: {remaining}')

          sample = pages[0].read_text(encoding='utf-8')
          if 'Shop this product' in sample or 'Ask about availability' in sample:
              raise SystemExit('Legacy product-page button labels remain')
          if 'class="breadcrumbs"' in sample:
              raise SystemExit('Visible breadcrumb shell remains on product pages')
          if '/?add=' not in sample and '>Inquire</a>' not in sample and '>Out of Stock</button>' not in sample:
              raise SystemExit('Product page is not wired to storefront purchase logic')

          index = Path('index.html').read_text(encoding='utf-8')
          if 'href="/#shop"' not in index or 'href="/#faq"' not in index:
              raise SystemExit('Original single-page navigation was not restored')

          print(f'Validated {len(pages)} integrated product pages')
          PY

      - name: Commit refreshed SEO pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "SEO pages are already current."
            exit 0
          fi
          git commit -m "Refresh integrated storefront SEO"
          git push origin "HEAD:${TARGET_BRANCH}"
