name: Apply USPS dynamic shipping

on:
  push:
    branches:
      - agent/add-usps-dynamic-shipping

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out USPS shipping branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-usps-dynamic-shipping
          fetch-depth: 0

      - name: Add dynamic shipping callback
        run: python scripts/add_usps_shipping_callback.py

      - name: Validate storefront JavaScript
        run: node --check shop/storefront.js

      - name: Commit generated storefront update
        run: |
          if git diff --quiet -- shop/storefront.js; then
            echo "No storefront changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/storefront.js
          git commit -m "Calculate USPS shipping during PayPal checkout"
          git push origin HEAD:agent/add-usps-dynamic-shipping
