name: Apply order confirmation redirect

on:
  push:
    branches:
      - agent/add-order-confirmation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out order confirmation branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-order-confirmation
          fetch-depth: 0

      - name: Add confirmation redirect
        run: python scripts/add_order_confirmation_redirect.py

      - name: Validate JavaScript
        run: |
          node --check shop/storefront.js
          node --check shop/order-confirmation.js

      - name: Commit generated redirect
        run: |
          if git diff --quiet -- shop/storefront.js; then
            echo "No storefront.js changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/storefront.js
          git commit -m "Redirect paid orders to confirmation page"
          git push origin HEAD:agent/add-order-confirmation
