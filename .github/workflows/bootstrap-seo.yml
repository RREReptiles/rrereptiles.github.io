name: Build SEO pages

on:
  push:
    branches:
      - main
      - agent/seo-optimization
      - agent/fix-seo-integration
      - agent/scrub-private-backend-name
      - agent/clean-product-detail-pages
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

jobs:
  build-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate integrated SEO pages
        run: |
          python scripts/build_seo_integrated.py
          python scripts/postprocess_seo_integration.py
          python scripts/clean_product_pages.py
          python scripts/scrub_private_backend_name.py

      - name: Validate output
        run: |
          python -m py_compile scripts/build_seo.py scripts/build_seo_integrated.py scripts/postprocess_seo_integration.py scripts/clean_product_pages.py scripts/scrub_private_backend_name.py
          node --check shop/storefront.js
          node --check shop/product-page.js
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          ET.parse('sitemap.xml')
          pages = list(Path('products').glob('*.html'))
          if not pages:
              raise SystemExit('No product pages generated')

          required = [
              Path('index.html'),
              Path('shop/product-page.js'),
              Path('llms.txt'),
              Path('sitemap.xml'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing generated files: {missing}')

          obsolete = [
              Path('shop/index.html'),
              Path('shop/reptiles.html'),
              Path('shop/reptile-supplies.html'),
              Path('shop/feeders.html'),
              Path('shop/aquatic-plants.html'),
              Path('shop/entomology-art.html'),
              Path('care-guides/index.html'),
              Path('about.html'),
              Path('contact.html'),
              Path('shipping.html'),
          ]
          remaining = [str(path) for path in obsolete if path.exists()]
          if remaining:
              raise SystemExit(f'Duplicate SEO shell pages remain: {remaining}')

          sample = pages[0].read_text(encoding='utf-8')
          if 'Shop this product' in sample or 'Ask about availability' in sample:
              raise SystemExit('Legacy product-page button labels remain')
          if 'class="breadcrumbs"' in sample:
              raise SystemExit('Visible breadcrumb shell remains on product pages')
          required_bindings = [
              'src="/shop/product-page.js"',
              'data-storefront-item-id=',
              'data-product-action',
              'data-product-price',
              'data-product-stock',
              'data-product-notice',
          ]
          missing_bindings = [value for value in required_bindings if value not in sample]
          if missing_bindings:
              raise SystemExit(f'Product page is missing live storefront bindings: {missing_bindings}')

          forbidden_product_copy = [
              '<dl class="details-list">',
              '<dt>Seller</dt>',
              '<dt>Location</dt>',
              '<dt>Product ID</dt>',
              '<section class="content-panel">',
              'Ordering through the original',
              'extension of the original website',
              'original Shop tab',
          ]
          product_failures = []
          for page in pages:
              content = page.read_text(encoding='utf-8')
              if not re.search(r'<body[^>]*\bdata-storefront-item-id="\d+"', content):
                  product_failures.append(f'{page}: missing hidden product ID binding')
              for value in forbidden_product_copy:
                  if value.casefold() in content.casefold():
                      product_failures.append(f'{page}: contains {value}')
          if product_failures:
              raise SystemExit(f'Customer-facing product cleanup failed: {product_failures}')

          supporting_copy = '\n'.join([
              Path('index.html').read_text(encoding='utf-8'),
              Path('llms.txt').read_text(encoding='utf-8'),
          ]).casefold()
          if 'original website' in supporting_copy:
              raise SystemExit('Public website copy still contains original website wording')

          storefront = Path('shop/storefront.js').read_text(encoding='utf-8')
          if "requestedValue === null ? null" not in storefront:
              raise SystemExit('Product-to-cart handoff still treats a missing item ID as zero')

          index = Path('index.html').read_text(encoding='utf-8')
          if 'href="/#shop"' not in index or 'href="/#faq"' not in index:
              raise SystemExit('Single-page navigation was not restored')

          private_name = ('Repti' + 'Trax').casefold()
          text_suffixes = {'.css', '.html', '.js', '.json', '.md', '.py', '.txt', '.xml', '.yaml', '.yml'}
          leaked = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'CNAME', 'robots.txt'}:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if private_name in content.casefold():
                  leaked.append(str(path))
          if leaked:
              raise SystemExit(f'Private backend naming remains in public source: {leaked}')

          print(f'Validated {len(pages)} integrated product pages')
          PY

      - name: Commit refreshed SEO pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "SEO pages are already current."
            exit 0
          fi
          git commit -m "Refresh integrated storefront SEO"
          git push origin "HEAD:${TARGET_BRANCH}"
