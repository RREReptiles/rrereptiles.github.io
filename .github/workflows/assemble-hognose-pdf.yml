name: Assemble Western Hognose PDF

on:
  push:
    branches:
      - agent/hognose-pdf-download

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/hognose-pdf-download
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble exact uploaded PDF and add download button
        run: python scripts/assemble_hognose_pdf.py

      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Western Hognose PDF download"
          git push origin HEAD:agent/hognose-pdf-download
