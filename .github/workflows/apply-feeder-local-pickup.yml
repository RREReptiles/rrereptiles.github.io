name: Apply storefront feeder local pickup rule

on:
  push:
    branches:
      - agent/feeder-local-pickup
    paths:
      - .github/workflows/apply-feeder-local-pickup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply_feeder_local_pickup.py

      - name: Commit patched storefront
        run: |
          rm scripts/apply_feeder_local_pickup.py
          rm .github/workflows/apply-feeder-local-pickup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/storefront.js shop/storefront.css scripts/apply_feeder_local_pickup.py .github/workflows/apply-feeder-local-pickup.yml
          git commit -m "Enforce feeder local pickup storefront"
          git push origin HEAD:${{ github.ref_name }}
