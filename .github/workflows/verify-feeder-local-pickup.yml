name: Verify feeder storefront JavaScript

on:
  push:
    branches:
      - agent/feeder-local-pickup
    paths:
      - .github/workflows/verify-feeder-local-pickup.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Check JavaScript syntax
        run: node --check shop/storefront.js
      - name: Remove temporary verification workflow
        run: |
          rm .github/workflows/verify-feeder-local-pickup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-feeder-local-pickup.yml
          git commit -m "Remove temporary storefront verification workflow"
          git push origin HEAD:${{ github.ref_name }}
